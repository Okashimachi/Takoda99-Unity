name: CI

# Unityライセンスを必要としない検証だけを行う（実行1〜2分）。
# Unity Editor でのテスト・WebGLビルドは、必要になった時点で別ワークフローとして追加する
# （GameCI + ライセンスのシークレット設定が要るため、コストが一段上がる）。

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同じブランチで新しいpushがあったら、走っている古いジョブは打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ビルド・テスト・Unity互換性
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: .NET SDK のセットアップ
        uses: actions/setup-dotnet@v4
        with:
          # テストプロジェクトは net8.0、本体は netstandard2.1。
          dotnet-version: '8.0.x'

      # --- 1. Unity非依存ロジックの単体テスト ---
      - name: pureC# の単体テスト
        run: dotnet test "pureC#/src/Takoda99.Client.Tests/Takoda99.Client.Tests.csproj" --verbosity minimal

      # --- 2. View用派生状態の単体テスト（Unityを起動しない） ---
      - name: View用派生状態の単体テスト
        run: dotnet test "Unity/tests/Takoda99.View.Tests/Takoda99.View.Tests.csproj" --verbosity minimal

      # --- 3. Unity互換性（最重要） ---
      # テストは net8.0 / LangVersion 10 で通るため、C# 10 の構文を書いても気づけない。
      # Unity と同じ netstandard2.1 / LangVersion 9 でコンパイルして、Unity側だけ壊れる事故を防ぐ。
      - name: Unity互換（C# 9）でコンパイルできるか
        run: dotnet build "Unity/tests/Takoda99.View.LangVersionCheck/Takoda99.View.LangVersionCheck.csproj" --verbosity minimal

      # --- 4. 責務境界の担保 ---
      # pureC# は Unity 非依存が絶対原則（docs/rules/01-責務と絶対原則.md）。
      # UnityEngine を参照するパッケージが無いためビルドも失敗するはずだが、
      # 条件付きコンパイル等ですり抜ける余地を潰すため明示的に検査する。
      - name: pureC#/src に UnityEngine が混入していないか
        run: |
          if grep -rn --include='*.cs' -E '^\s*using\s+UnityEngine' "pureC#/src"; then
            echo "::error::pureC#/src は Unity 非依存です。UnityEngine への参照は Unity/Assets/ 側へ移してください（docs/rules/01-責務と絶対原則.md）"
            exit 1
          fi
          echo "OK: UnityEngine の参照なし"

      # --- 5. 契約の保護 ---
      # Proto は上流が正典で、このリポジトリでは内容を変更しない（docs/rules/01-責務と絶対原則.md）。
      #
      # 「develop から変更されていないこと」ではなく「上流とバイト一致していること」を検証する。
      # 前者だと (a) 正規のバージョン追従まで弾いてしまい、(b) 一度 develop に入った改変を
      # 以後ずっと見逃す。後者なら手による改変を恒久的に検知でき、追従は素通しできる。
      #
      # 参照する版は VERSION.md の「固定バージョン」行から読む。Takoda99-Proto は public なので
      # 認証不要（private 化したら PAT をシークレットに追加すること）。
      - name: Proto の手ミラーが上流と一致しているか
        run: |
          set -euo pipefail
          MIRROR="pureC#/vendor/Takoda99.Proto/Messages.cs"
          VERSION_MD="pureC#/vendor/Takoda99.Proto/VERSION.md"

          TAG="$(grep '固定バージョン' "$VERSION_MD" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ -z "$TAG" ]; then
            echo "::error file=$VERSION_MD::固定バージョン（vX.Y.Z）を読み取れませんでした。「- 固定バージョン: タグ \`vX.Y.Z\`」の形式で記載してください"
            exit 1
          fi
          echo "固定バージョン: $TAG"

          URL="https://raw.githubusercontent.com/Okashimachi/Takoda99-Proto/${TAG}/csharp/Takoda99.Proto/Messages.cs"
          if ! curl -fsSL "$URL" -o /tmp/upstream_messages.cs; then
            echo "::error::上流の取得に失敗しました: $URL （タグ $TAG は Takoda99-Proto に存在しますか）"
            exit 1
          fi

          # 改行コードの差は無視する（Unity 側の作業ツリーが CRLF になり得るため）。
          if ! diff -u <(tr -d '\r' < /tmp/upstream_messages.cs) <(tr -d '\r' < "$MIRROR"); then
            echo "::error file=$MIRROR::手ミラーが上流（$TAG）と一致しません。このリポジトリで内容を変更しないでください。バージョンを上げる場合は上流のファイルで丸ごと置き換え、VERSION.md の固定バージョンも更新してください（docs/rules/01-責務と絶対原則.md）"
            exit 1
          fi
          echo "OK: 手ミラーは上流 $TAG と一致"
